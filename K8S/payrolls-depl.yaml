apiVersion: apps/v1
kind: Deployment
metadata: 
  name: payrolls-depl
spec: 
  replicas: 1
  selector: 
     matchLabels:
       app: payrollservice
  template: 
    metadata:
      labels:
        app: payrollservice
    spec:
      containers: 
         - name: payrollservice
           image: nkaka23dev/payrollservice:latest        
---
apiVersion: v1
kind: Service
metadata:
  name: payrollservice-clusterip-srv
spec: 
  type: ClusterIP
  selector: 
    app: payrollservice
  ports:
   - name: payrollservice
     protocol: TCP
     port: 80
     targetPort: 80 
     